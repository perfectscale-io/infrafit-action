# CI for perfectscale-io/infrafit-action
#
# Runs on every push and pull request:
#   lint — shellcheck on infrafit-apply.sh, actionlint on action.yml
#
# Actions are SHA-pinned per the org policy.

name: CI

on:
  push:
    branches: [ main, feat/initial-implementation ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning

      - name: actionlint
        shell: bash
        run: |
          # Download script pinned to a commit SHA per the org SHA-pinning policy.
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/3795ba2f6cb243eeca54c9d22e5c531cb9dcfb4a/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
